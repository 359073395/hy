name: tiktok-knowledge
services:
  app:
    image: ${TIKTOK_IMAGE:-ghcr.io/359073395/tiktok-knowledge:0.1.0}
    container_name: tiktok-knowledge
    restart: unless-stopped
    init: true
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8791}:3000"
    environment:
      PGDATABASE_URL: postgres://knowledge:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/knowledge
      POSTGREST_URL: http://rest:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      SITE_URL: ${SITE_URL:-}
      PORT: "3000"
      DATA_DIR: /app/data
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    networks: [default, backend]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_DB: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB"]
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U knowledge -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
  rest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://knowledge:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/knowledge
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: knowledge_api
      PGRST_DB_POOL: "5"
      PGRST_SERVER_PORT: "3000"
      PGRST_LOG_LEVEL: warn
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
networks:
  backend:
    internal: true
