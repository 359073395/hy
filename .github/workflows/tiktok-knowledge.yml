name: TikTok knowledge

on:
  push:
    branches: [main, feat/tiktok-knowledge]
    paths:
      - 'apps/tiktok-knowledge/**'
      - '.github/workflows/tiktok-knowledge.yml'
      - 'tests/tests_tiktok_knowledge_installer.sh'
      - 'harvey.sh'
      - 'cn/harvey.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiktok-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/tiktok-knowledge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Check types and regression tests
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint
          for script in ../../harvey.sh ../../cn/harvey.sh install.sh; do bash -n "$script"; done
          bash ../../tests/tests_tiktok_knowledge_installer.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build production container
        uses: docker/build-push-action@v6
        with:
          context: apps/tiktok-knowledge
          load: true
          tags: tiktok-knowledge:test
          cache-from: type=gha,scope=tiktok-amd64
          cache-to: type=gha,scope=tiktok-amd64,mode=max
      - name: Start a fresh database and application
        run: |
          admin_token=$(openssl rand -hex 24)
          database_password=$(openssl rand -hex 24)
          admin_password=$(openssl rand -hex 20)
          echo "::add-mask::$admin_token"
          echo "::add-mask::$database_password"
          echo "::add-mask::$admin_password"
          printf 'ADMIN_TOKEN=%s\nPOSTGRES_PASSWORD=%s\nSITE_URL=http://127.0.0.1:8791\nAPP_PORT=8791\nTIKTOK_IMAGE=tiktok-knowledge:test\nTEST_ADMIN_USERNAME=ci-admin\nTEST_ADMIN_PASSWORD=%s\n' "$admin_token" "$database_password" "$admin_password" > .env
          mkdir -p data
          sudo chown 1001:1001 data
          docker compose up -d --wait --wait-timeout 240
      - name: Verify permissions, imports and exams through HTTP
        run: node --env-file=.env tests/integration.mjs
      - name: Verify password setup and selected administrator reset
        run: node --env-file=.env tests/admin-credentials.mjs
      - name: Verify employee token changes synchronize with administrator data
        run: node --env-file=.env tests/token-sync.mjs
      - name: Verify knowledge statistics, missing content repair and loop management
        run: node --env-file=.env tests/knowledge-admin.mjs
      - name: Verify browser workflows
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          node --env-file=.env tests/browser-smoke.mjs
      - name: Verify restart preserves edits and people
        run: |
          docker compose restart app
          docker compose up -d --wait --wait-timeout 180
          node --env-file=.env tests/integration.mjs --after-restart
          node --env-file=.env tests/token-sync.mjs --after-restart
      - name: Download a full backup and restore through the installer
        run: |
          node --env-file=.env tests/backup-smoke.mjs
          docker compose exec -T db psql -U knowledge -d knowledge -v ON_ERROR_STOP=1 -c "UPDATE chapters SET title = 'changed after backup'; UPDATE users SET status = 'active';"
          sudo env APP_DIR="$PWD" bash install.sh --restore "$PWD/test-results/full-backup.tar.gz"
          node --env-file=.env tests/integration.mjs --after-restart
          node --env-file=.env tests/token-sync.mjs --after-restart
      - name: Verify a populated 0.1.0 installation upgrades with its existing domain and data
        run: |
          docker compose down
          legacy="$RUNNER_TEMP/tiktok-legacy"
          mkdir -p "$legacy/data"
          sudo chown 1001:1001 "$legacy/data"
          cp compose.yaml "$legacy/compose.yaml"
          sed 's|TIKTOK_IMAGE=tiktok-knowledge:test|TIKTOK_IMAGE=ghcr.io/359073395/tiktok-knowledge:0.1.0|; s|SITE_URL=http://127.0.0.1:8791|SITE_URL=https://existing-domain.example|' .env > "$legacy/.env"
          cp "$legacy/.env" "$legacy/before.env"
          curl -fSL --retry 3 'https://github.com/359073395/hy/releases/download/tiktok-knowledge-v0.1.0/tiktok-knowledge-0.1.0-linux-amd64.tar.gz' -o "$RUNNER_TEMP/legacy-image.tar.gz"
          docker load --input "$RUNNER_TEMP/legacy-image.tar.gz"
          docker compose --project-directory "$legacy" --env-file "$legacy/.env" -f "$legacy/compose.yaml" up -d --wait --wait-timeout 240
          node --env-file="$legacy/.env" tests/integration.mjs
          node --env-file="$legacy/.env" tests/legacy-upgrade.mjs --before
          sed -i 's|TIKTOK_IMAGE=ghcr.io/359073395/tiktok-knowledge:0.1.0|TIKTOK_IMAGE=tiktok-knowledge:test|' "$legacy/.env"
          docker compose --project-directory "$legacy" --env-file "$legacy/.env" -f "$legacy/compose.yaml" up -d --wait --wait-timeout 240
          node --env-file="$legacy/.env" tests/legacy-upgrade.mjs --after
          node --env-file="$legacy/.env" tests/admin-credentials.mjs
          diff <(grep -v '^TIKTOK_IMAGE=' "$legacy/before.env") <(grep -v '^TIKTOK_IMAGE=' "$legacy/.env")
      - name: Diagnostic logs
        if: failure()
        run: docker compose logs --no-color --tail=150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiktok-verification
          path: |
            apps/tiktok-knowledge/test-results/*-results.json
            apps/tiktok-knowledge/test-results/*.png
          if-no-files-found: ignore
      - name: Shut down test services
        if: always()
        run: docker compose down

  release-check:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check immutable version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cat apps/tiktok-knowledge/VERSION)
          if gh release view "tiktok-knowledge-v$version" >/dev/null 2>&1; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

  publish-images:
    needs: release-check
    if: needs.release-check.outputs.needed == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        id: version
        run: echo "value=$(cat apps/tiktok-knowledge/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/tiktok-knowledge
          load: true
          tags: ghcr.io/359073395/tiktok-knowledge:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/359073395/hy
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=tiktok-${{ matrix.arch }}
          cache-to: type=gha,scope=tiktok-${{ matrix.arch }},mode=max
      - name: Publish architecture image and portable archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/359073395/tiktok-knowledge:$VERSION"
          docker tag "$image" "$image-$ARCH"
          docker push "$image-$ARCH"
          mkdir -p release
          docker save "$image" | gzip -1 > "release/tiktok-knowledge-$VERSION-linux-$ARCH.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-image-${{ matrix.arch }}
          path: release/*.tar.gz
          compression-level: 0
          retention-days: 3

  release:
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: tiktok-image-*
          merge-multiple: true
          path: release
      - name: Publish multi-platform tags and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cat apps/tiktok-knowledge/VERSION)
          image=ghcr.io/359073395/tiktok-knowledge
          docker buildx imagetools create --tag "$image:$version" --tag "$image:latest" "$image:$version-amd64" "$image:$version-arm64"
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
          tag="tiktok-knowledge-v$version"
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "TikTok 知识系统 $version" --notes-file apps/tiktok-knowledge/RELEASE.md

  verify-published-installer:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and update the public release without registry credentials
        run: |
          node -e 'require("fs").writeFileSync("/tmp/admin-setup.json", JSON.stringify({action:"create",username:"published-admin",password:require("crypto").randomBytes(24).toString("hex")}), {mode:0o600})'
          sudo env ADMIN_SETUP_FILE=/tmp/admin-setup.json bash apps/tiktok-knowledge/install.sh --install --ref "$GITHUB_SHA" > /tmp/knowledge-install.log 2>&1 || { cat /tmp/knowledge-install.log; exit 1; }
          curl --fail --silent http://127.0.0.1:8791/api/health
          node apps/tiktok-knowledge/tests/check-installed-admin.mjs /tmp/admin-setup.json
          sudo cp /opt/tiktok-knowledge/.env /tmp/knowledge-original.env
          sudo bash apps/tiktok-knowledge/install.sh --update --ref "$GITHUB_SHA" > /tmp/knowledge-update.log 2>&1 || { cat /tmp/knowledge-update.log; exit 1; }
          curl --fail --silent http://127.0.0.1:8791/api/health
          node apps/tiktok-knowledge/tests/check-installed-admin.mjs /tmp/admin-setup.json
          sudo cmp /tmp/knowledge-original.env /opt/tiktok-knowledge/.env
          sudo test -s /opt/tiktok-knowledge/backups/latest-pre-update/database.dump
      - name: Upgrade the public 0.1.0 release through the new installer
        working-directory: apps/tiktok-knowledge
        run: |
          sudo bash install.sh --uninstall
          legacy=/opt/tiktok-knowledge-legacy-test
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/359073395/hy/4c85cd67c85d3fe8709e362c9619b5bd522d9d69/apps/tiktok-knowledge/install.sh' -o /tmp/legacy-install.sh
          sudo env APP_DIR="$legacy" SITE_URL=https://existing-domain.example bash /tmp/legacy-install.sh --install --ref 4c85cd67c85d3fe8709e362c9619b5bd522d9d69 > /tmp/legacy-install.log 2>&1 || { cat /tmp/legacy-install.log; exit 1; }
          sudo cp "$legacy/.env" /tmp/legacy-test.env
          sudo chown "$USER" /tmp/legacy-test.env
          node --env-file=/tmp/legacy-test.env tests/integration.mjs
          node --env-file=/tmp/legacy-test.env tests/legacy-upgrade.mjs --before
          sudo env APP_DIR="$legacy" ADMIN_SETUP_FILE=/tmp/admin-setup.json bash install.sh --update --ref "$GITHUB_SHA" > /tmp/legacy-update.log 2>&1 || { cat /tmp/legacy-update.log; exit 1; }
          node tests/check-installed-admin.mjs /tmp/admin-setup.json
          node --env-file=/tmp/legacy-test.env tests/legacy-upgrade.mjs --after --allow-new-admin
          diff <(sudo grep -v '^TIKTOK_IMAGE=' "$legacy/.env") <(grep -v '^TIKTOK_IMAGE=' /tmp/legacy-test.env)
          sudo env APP_DIR="$legacy" bash install.sh --uninstall
      - name: Stop published test services
        if: always()
        run: sudo bash apps/tiktok-knowledge/install.sh --uninstall
